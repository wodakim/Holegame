<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="grad-red" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Body -->
  <rect x="35" y="20" width="30" height="60" rx="5" fill="url(#grad-red)" filter="url(#shadow)"/>
  <rect x="30" y="80" width="40" height="10" rx="2" fill="#a02c2c"/>
  <circle cx="50" cy="20" r="15" fill="url(#grad-red)"/>

  <!-- Eyes (Bolts) -->
  <circle cx="40" cy="40" r="6" fill="#fff"/>
  <circle cx="40" cy="40" r="2" fill="#000"/>
  <circle cx="60" cy="40" r="6" fill="#fff"/>
  <circle cx="60" cy="40" r="2" fill="#000"/>

  <!-- Spout -->
  <rect x="25" y="55" width="10" height="10" rx="2" fill="#bdc3c7"/>
  <rect x="65" y="55" width="10" height="10" rx="2" fill="#bdc3c7"/>
</svg>