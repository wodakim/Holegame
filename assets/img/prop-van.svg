<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad-van" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1abc9c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a085;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Wheels -->
  <circle cx="30" cy="80" r="10" fill="#2c3e50"/>
  <circle cx="70" cy="80" r="10" fill="#2c3e50"/>
  <!-- Body -->
  <rect x="15" y="30" width="70" height="50" rx="5" fill="url(#grad-van)"/>
  <!-- Windows -->
  <rect x="20" y="35" width="20" height="15" fill="#ecf0f1"/>
  <rect x="45" y="35" width="20" height="15" fill="#ecf0f1"/>
  <!-- Stripe -->
  <rect x="15" y="55" width="70" height="5" fill="#f1c40f"/>
  <!-- Flower -->
  <circle cx="55" cy="65" r="5" fill="#e91e63"/>
</svg>