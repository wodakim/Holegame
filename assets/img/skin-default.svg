<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="grad-void" cx="50%" cy="50%" r="50%">
      <stop offset="80%" style="stop-color:#000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f3ff;stop-opacity:0.8" />
    </radialGradient>
  </defs>
  <!-- The Void -->
  <circle cx="50" cy="50" r="45" fill="url(#grad-void)"/>
  <!-- Neon Rim -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#00f3ff" stroke-width="4" stroke-dasharray="20 10">
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>