<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>URBAN VOID: AAA HYPER-CASUAL EXPERIENCE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/warning.css">
    <link rel="stylesheet" href="css/missions.css">
</head>
<body>

    <!-- Layer 1: The Abyss (Space/Nebula Background) -->
    <div id="abyss-background"></div>

    <!-- Layer 2: The Game World (The Floor/City Grid) -->
    <canvas id="game-canvas"></canvas>

    <!-- Layer 3: UI Overlay -->
    <div id="ui-layer">

        <!-- Main Menu -->
        <div id="screen-main-menu" class="screen active">
            <h1 class="game-title">URBAN VOID</h1>
            <div class="coin-display">
                <span class="coin-icon">©</span> <span id="menu-coin-count">0</span>
            </div>

            <div id="mission-board">
                <h3>DAILY MISSIONS</h3>
                <ul id="mission-list">
                    <!-- Missions injected by JS -->
                </ul>
            </div>

            <div class="police-warning">
                ⚠️ WARNING: POLICE CARS CARRY "VOID CURE". DO NOT EAT! ⚠️
            </div>

            <button id="btn-play" class="btn-primary pulse">PLAY</button>

            <div class="bottom-controls">
                <button id="btn-no-ads" class="btn-secondary">NO ADS</button>
                <button id="btn-shop" class="btn-secondary">SKINS / SHOP <span id="shop-badge" class="badge hidden">!</span></button>
            </div>
        </div>

        <!-- HUD (In-Game) -->
        <div id="screen-hud" class="screen hidden">
            <div class="hud-top-left">
                <div id="leaderboard">
                    <div class="rank-item">1. VoidKing</div>
                    <div class="rank-item">2. You</div>
                    <div class="rank-item">3. Eater_X</div>
                </div>
            </div>
            <div class="hud-top-center">
                <div id="game-timer">02:00</div>
            </div>
            <div class="hud-top-right">
                <div class="score-box">SCORE: <span id="hud-score">0</span></div>
                <div class="kills-box">KILLS: <span id="hud-kills">0</span></div>
            </div>

            <!-- Virtual Joystick Zone (Invisible but covers area) -->
            <div id="joystick-zone"></div>
        </div>

        <!-- Shop Screen -->
        <div id="screen-shop" class="screen hidden">
            <h2>SHOP</h2>
            <div class="coin-display-shop">
                <span class="coin-icon">©</span> <span id="shop-coin-count">0</span>
            </div>
            <div id="skin-grid" class="skin-grid">
                <!-- Skins injected by JS -->
            </div>
            <button id="btn-back-shop" class="btn-secondary">BACK</button>
        </div>

        <!-- Game Over Screen -->
        <div id="screen-game-over" class="screen hidden">
            <h1>ROUND OVER</h1>
            <h2 id="final-rank">RANK #5</h2>

            <div class="progress-container">
                <div class="progress-label">Level Progress</div>
                <div class="progress-bar-bg">
                    <div id="progress-bar-fill" class="progress-bar-fill" style="width: 50%;"></div>
                </div>
                <div class="rewards-text">+<span id="earned-coins">150</span> Coins</div>
            </div>

            <button id="btn-revive" class="btn-primary">REVIVE (Watch Ad)</button>
            <button id="btn-replay" class="btn-secondary">REPLAY</button>
        </div>

    </div>

    <!-- Banner Ad Container -->
    <div id="ad-banner">
        <span>ADVERTISEMENT</span>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/main.js"></script>

</body>
</html>
